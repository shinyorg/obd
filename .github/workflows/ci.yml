name: CI

# Every push to main, and every pull request into it: build and test the packages the way a release builds them,
# without publishing. Releases come from tags - see release.yml. Toolchain pins match release.yml - bump them together.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'skills/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # xcode-27 (a preview image): macos-latest still defaults to Xcode 26, while the .NET 11 workloads ship the
    # 27.x iOS/Mac Catalyst/macOS packs. Shiny.Obd.Ble sets EnableWindowsTargeting itself, so its
    # net11.0-windows lib builds here too.
    runs-on: xcode-27

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
          dotnet-version: '11.0.100'
          workloads: maui-ios, maui-android, maui-maccatalyst, macos

    - name: Select Xcode 27.1
      run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer && xcodebuild -version

    - name: Build
      run: dotnet build build.slnf /restore -m -property:Configuration=Release

    - name: Test
      run: dotnet test tests/Shiny.Obd.Tests/Shiny.Obd.Tests.csproj --configuration Release --no-build

    - name: Publish Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nugets
        path: |
          src/**/bin/Release/*.nupkg
          src/**/bin/Release/*.snupkg
        retention-days: 5
